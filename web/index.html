<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Bot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="quiz-card">

            <div class="header">
                <h1>Quiz Bot</h1>

                <p id="progress">
                    Savol 1 / 10
                </p>
            </div>

            <div class="progress-container">
                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>
            </div>

            <div class="question-box">

                <h2 id="question">
                    Savol yuklanmoqda...
                </h2>

            </div>

            <div
                class="options"
                id="options"
            ></div>

            <button
                id="nextBtn"
                class="next-btn"
                disabled
            >
                Keyingi
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
